# Scans code comments. Set `language` to your source language (java, python,
# rust, go, tsx, ...) — see docs/adapting.md.
id: comment-load-bearing
language: typescript
severity: warning
message: >-
  "load-bearing" terminology in a comment — forbidden in any spelling
  (load-bearing, load bearing, loadbearing). It gestures at importance without
  naming it. Pick a different word and state the actual consequence ("removing
  this drops the retry guard, so a duplicate write returns success twice").
note: >-
  Matches any separator and case, but exempts the compound rule name
  (`comment-load-bearing`, preceded by a hyphen) so references to this rule do
  not self-trip. Run `ast-grep scan --rule rules/comment-load-bearing.yml`.
rule:
  kind: comment
  regex: '(?i)(^|[^\w-])load[\s_-]*bearing'
