# JavaScript sibling of comment-caps-theater — scans `//` and `/* */` comments
# in javascript/mjs sources.
id: js-caps-theater
language: javascript
severity: hint
message: >-
  Caps-theater in a comment — an all-caps word used for emphasis (MUST, NEVER,
  NOT, ONLY, SAME, EXACT...). The standard bans this: write plainly and let
  sentence structure carry the weight. Rewrite the emphasis as prose, or delete
  it if the surrounding sentence already makes the point.
note: >-
  The whitelist is emphasis words only, so acronyms (JSON, HTTP, API, ID) and
  code identifiers never fire — only rhetorical shouting does. A hint, not a
  hard fail: a curated set means low false positives, but read each before
  rewriting. Run `ast-grep scan --rule rules/js-caps-theater.yml`.
rule:
  kind: comment
  regex: \b(MUST|NEVER|ALWAYS|NOT|ONLY|EXACTLY|EXACT|SAME|BOTH|REAL|EVERY|SINGLE|CANNOT)\b
